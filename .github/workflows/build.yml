name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Least privilege (2026-08-08 security audit): this workflow only builds and
# uploads a build artifact, it never pushes to the repo or touches PRs/issues -
# the default GITHUB_TOKEN scope can be wider than that depending on org
# settings, so pin it down explicitly instead of relying on the default.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # A release must never ship something the checks would have caught.
      - name: Run checks
        run: npm run check

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-tweaker-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
