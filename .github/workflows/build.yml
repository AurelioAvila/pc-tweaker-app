name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Least privilege (2026-08-08 security audit): this workflow only builds and
# uploads a build artifact, it never pushes to the repo or touches PRs/issues -
# the default GITHUB_TOKEN scope can be wider than that depending on org
# settings, so pin it down explicitly instead of relying on the default.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install frontend dependencies
        run: npm ci

      # A release must never ship something the checks would have caught.
      - name: Run checks
        run: npm run check

      # CI proves the source builds; it does not distribute unsigned installers.
      # Publisher and updater signing happen on the authorized release machine.
      # The local manifest helper, stable aliases and WinGet have independent gates.
      - name: Build without distributing verification artifacts
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
