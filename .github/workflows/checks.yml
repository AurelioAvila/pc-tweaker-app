name: Npackd package verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed public release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  npackd:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify the signed Npackd package in isolation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./packaging/npackd/verify-package.ps1
