name: Site checks

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
      # The site's structured-data version is read from here at build time
      # (see the shared SoftwareApplication data in site/src/seo.ts). Without this, a
      # release version changes must also pass the site's checks.
      - "src-tauri/tauri.conf.json"
      # The legal pages render the root PRIVACY.md and TERMS.md (Legal.tsx imports them
      # with ?raw), so editing either must also pass site checks.
      - "PRIVACY.md"
      - "TERMS.md"
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
      - "src-tauri/tauri.conf.json"
      - "PRIVACY.md"
      - "TERMS.md"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - run: npm run check:attribution
      - run: npm run check:account
      # Public artifacts use the local publisher-signed deployment flow.
      # A CI rebuild must never replace that artifact with unsigned output.
