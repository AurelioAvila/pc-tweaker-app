name: Discord release announcement

# Posts a message to the project's Discord server every time a GitHub
# Release is published, pinging @everyone. Fires on the same event as the
# stable-download-alias workflow, so it catches a release regardless of
# whether it was published by the tag-triggered release.yml or manually via
# `gh release create` (as happens for locally-built, locally-signed builds
# — see RELEASING.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (defaults to latest)"
        required: false

# Without this, the job inherits whatever the repository default happens to
# be, which on many repos is write access to everything. It only ever reads
# release metadata, so that is all it gets.
permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG="$INPUT_TAG"; fi
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName); fi
          NAME=$(gh release view "$TAG" --repo "$REPO" --json name --jq .name)
          URL=$(gh release view "$TAG" --repo "$REPO" --json url --jq .url)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Release notes are built into the JSON payload via jq --arg/--argjson,
      # never string-interpolated, so quotes/newlines/backticks in the
      # changelog can't break the payload — the same class of bug as
      # building JSON by hand instead of through a serializer.
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.release.outputs.tag }}
          NAME: ${{ steps.release.outputs.name }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping announcement"
            exit 0
          fi
          NOTES=$(gh release view "$TAG" --json body --jq .body --repo "${{ github.repository }}")

          # Discord rejects a `content` over 2000 characters outright, so the
          # notes are trimmed to a budget that leaves room for the heading, the
          # link and the "read the rest" line. Cut at a line boundary: stopping
          # mid-sentence reads as a message that failed to send rather than one
          # that was deliberately shortened.
          BUDGET=1500
          if [ "${#NOTES}" -gt "$BUDGET" ]; then
            NOTES="$(printf '%s' "$NOTES" | head -c "$BUDGET" | sed '$d')"
            NOTES="$NOTES

          ...full release notes on the page below."
          fi

          CONTENT=$(jq -n --arg name "$NAME" --arg notes "$NOTES" --arg url "$URL" \
            '"@everyone **" + $name + "** is out!\n\n" + $notes + "\n\n" + $url')
          PAYLOAD=$(jq -n --argjson content "$CONTENT" \
            '{content: $content, allowed_mentions: {parse: ["everyone"]}}')

          # -f turns Discord's rejection into a non-zero exit; without --show-error
          # the reason never reaches the log, which is how the 2000-character
          # limit went unnoticed until the first long release.
          curl -sf --show-error -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"
