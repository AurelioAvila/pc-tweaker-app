name: Stable download alias

# Releases are versioned by filename (pc-tweaker-app_X.Y.Z_x64-setup.exe),
# which is correct for the release page but useless as a permanent "click to
# download" link — it changes every release. This mirrors each new release's
# installer under a fixed name (PCTweaker-Setup.exe/.msi) so the website can
# link to /releases/latest/download/PCTweaker-Setup.exe once and never touch
# it again.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to alias (defaults to latest)"
        required: false

permissions:
  contents: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ inputs.tag }}"; fi
          if [ -z "$TAG" ]; then TAG=$(gh release view --json tagName --jq .tagName); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download versioned installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*_x64-setup.exe" \
            --pattern "*_x64_en-US.msi" \
            --clobber -D dl

      - name: Rename to stable filenames
        run: |
          mkdir -p out
          cp "$(ls dl/*_x64-setup.exe)" out/PCTweaker-Setup.exe
          cp "$(ls dl/*_x64_en-US.msi)" out/PCTweaker-Setup.msi

      - name: Upload stable aliases to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            out/PCTweaker-Setup.exe out/PCTweaker-Setup.msi \
            --repo "${{ github.repository }}" --clobber
