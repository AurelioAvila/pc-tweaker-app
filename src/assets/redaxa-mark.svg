<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5637c9"/>
      <stop offset="100%" stop-color="#2a1668"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="120" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- "Lock Pup": the shackle doubles as a pair of ear-loops, so the mark
       reads as a friendly character first and a padlock second. -->
  <path d="M196 216 v-28 a60 60 0 0 1 120 0 v28" fill="none" stroke="#f4f3ef" stroke-width="26" stroke-linecap="round"/>

  <!-- Body: a padlock silhouette with the rounded corners of the rest of
       the character family, not the sharp edges of a literal lock icon. -->
  <rect x="152" y="208" width="208" height="176" rx="46" fill="#f4f3ef"/>

  <!-- Open eye, with a small catch-light so it doesn't read as a dead dot. -->
  <circle cx="216" cy="278" r="14" fill="#14092e"/>
  <circle cx="220" cy="274" r="4" fill="#ffffff"/>

  <!-- The other eye is a wink — and the wink IS the redaction bar, the
       one piece of visual grammar every mark in this family shares. -->
  <rect x="272" y="270" width="36" height="13" rx="6.5" fill="#14092e"/>

  <!-- Blush, on the winking side only: a wink reads as more of a gesture
       when the cheek underneath it is doing something too. -->
  <circle cx="332" cy="322" r="15" fill="#ffb27a" opacity="0.55"/>

  <!-- Keyhole mouth: round + slot, the one unmistakably "lock" detail
       that keeps this from reading as a generic round mascot. -->
  <circle cx="256" cy="326" r="10" fill="#14092e"/>
  <rect x="250" y="330" width="12" height="18" fill="#14092e"/>
</svg>
